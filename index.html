<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Image -->
    <img src="Images/bg.jpg" alt="Background" class="background-image">

    <div class="container">

        <div class="converter-card">

            <h1>🌡️ Temperature Converter</h1>

            <p class="subtitle">
                Convert temperatures between Celsius, Fahrenheit and Kelvin
            </p>

            <div class="input-group">
                <label for="temperature">Temperature</label>

                <input
                    type="number"
                    id="temperature"
                    placeholder="Enter temperature"
                    step="any"
                >
            </div>

            <div class="input-group">

                <label for="unit">Convert From</label>

                <select id="unit">
                    <option value="celsius">Celsius (°C)</option>
                    <option value="fahrenheit">Fahrenheit (°F)</option>
                    <option value="kelvin">Kelvin (K)</option>
                </select>

            </div>

            <button id="convertBtn">
                Convert Temperature
            </button>

            <p id="errorMessage" class="error"></p>

            <div class="results">

                <h2>Converted Temperature</h2>

                <div class="result-box">
                    <span>Celsius</span>
                    <strong id="celsiusResult">-- °C</strong>
                </div>

                <div class="result-box">
                    <span>Fahrenheit</span>
                    <strong id="fahrenheitResult">-- °F</strong>
                </div>

                <div class="result-box">
                    <span>Kelvin</span>
                    <strong id="kelvinResult">-- K</strong>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
